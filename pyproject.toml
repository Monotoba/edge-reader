[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-readaloud-pyside6"
version = "0.1.0a1"
description = "Cross-platform desktop read-aloud app with live playback and offline bundles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Monotoba" }
]
maintainers = [
  { name = "Monotoba" }
]
keywords = [
  "text-to-speech",
  "tts",
  "edge-tts",
  "audiobook",
  "reader",
  "pyside6",
  "desktop-app",
  "accessibility"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Office/Business",
  "Topic :: Text Processing"
]

dependencies = [
  "PySide6>=6.7",
  "edge-tts>=6.1.0",
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "striprtf>=0.0.26"
]

[project.urls]
Homepage = "https://github.com/Monotoba/edge-reader"
Documentation = "https://github.com/Monotoba/edge-reader#readme"
Repository = "https://github.com/Monotoba/edge-reader.git"
"Bug Tracker" = "https://github.com/Monotoba/edge-reader/issues"
Changelog = "https://github.com/Monotoba/edge-reader/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
edge-reader = "edge_reader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# UI and worker boundaries report unexpected external-library errors to users.
"src/edge_reader/main.py" = ["BLE001"]
"src/edge_reader/workers.py" = ["BLE001"]
